---
name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build bundle
        run: npm run build

      - name: Fail if dist/ is stale
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/hierarchy-cards.js is out of date. Run 'npm run build' and commit it before tagging."
            git diff --stat -- dist
            exit 1
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/hierarchy-cards.js
          generate_release_notes: true
